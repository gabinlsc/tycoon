# Tycoon Hub : environnement de développement (HTTP seul pour l'instant).
# Installé par scripts/deploy.sh dans /etc/nginx/sites-available.
server {
    listen 80;
    listen [::]:80;
    server_name tycoon.glsc.fr;

    root /var/www/tycoon.glsc.fr/current;
    index index.html;

    # Environnement de développement : on ne veut pas être indexé.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Les fichiers de /assets portent un hash dans leur nom : cache long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Toutes les autres routes (/jeux/label-tycoon, /label, /compte…) sont gérées par l'application.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /var/log/nginx/tycoon.glsc.fr.access.log;
    error_log  /var/log/nginx/tycoon.glsc.fr.error.log;
}
