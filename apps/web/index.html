<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Tycoon — le quotidien de l'économie imaginaire</title>
    <meta
      name="description"
      content="Six empires à bâtir dans le navigateur : musique, street food, sneakers, nightlife, football, pègre. Gratuit, sans compte, un défi par jour."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Le Tycoon — le quotidien de l'économie imaginaire" />
    <meta
      property="og:description"
      content="Six empires à bâtir dans le navigateur. Gratuit, sans compte, un défi par jour."
    />
    <link rel="preload" href="/fonts/caslon-400.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/public-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b17" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:," />
    <script>
      // Pose le thème choisi avant le premier rendu, pour éviter un éclair de papier clair.
      try {
        var t = localStorage.getItem('tycoon-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
